version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cortex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cortex_db}
      POSTGRES_USER: ${POSTGRES_USER:-cortex_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cortex_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cortex_user} -d ${POSTGRES_DB:-cortex_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cortex-network

  redis:
    image: redis:7-alpine
    container_name: cortex-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cortex-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cortex-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgres://${POSTGRES_USER:-cortex_user}:${POSTGRES_PASSWORD:-cortex_password}@postgres:5432/${POSTGRES_DB:-cortex_db}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cortex-network

  nginx:
    image: nginx:alpine
    container_name: cortex-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - cortex-network

# Persistent Data Volumes
volumes:
  postgres_data:
  redis_data:

networks:
  cortex-network:
    driver: bridge
